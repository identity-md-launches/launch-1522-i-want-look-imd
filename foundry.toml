[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
